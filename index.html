<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя музыка</title>
    <style>
        /* Фон страницы */
        body {
            background: linear-gradient(135deg, #1e1e2f, #3a3a5a);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Сама карточка */
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 450px;
            width: 100%;
        }

        /* Блок с картинкой и текстом (ставит их в ряд) */
        .top-section {
            display: flex;       /* Ставит элементы в одну строку */
            align-items: center; /* Выравнивает по центру по вертикали */
            gap: 20px;           /* Расстояние между картинкой и текстом */
            margin-bottom: 25px; /* Отступ снизу до плеера */
        }

        /* Картинка */
        .cover-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Блок с текстом */
        .text-container {
            text-align: left; /* Текст выравнивается по левому краю */
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            font-weight: 600;
        }

        .description {
            margin: 0;
            font-size: 14px;
            color: #b3b3b3;
            line-height: 1.4;
        }

        /* Плеер (растягиваем на всю ширину карточки) */
        audio {
            width: 100%;
            border-radius: 30px;
            outline: none;
            accent-color: #ff7eb3; 
        }
    </style>
</head>
<body>
    <div class="player-card">
        
        <!-- Верхняя часть: Картинка + Текст -->
        <div class="top-section">
            <img src="https://i.pinimg.com/originals/d7/33/29/d733295b90f44083928e5176c3c65586.png?nii=t" alt="Обложка" class="cover-img">
            
            <div class="text-container">
                <h1>Эпилог</h1>
                <p class="description">
                  он ᴨиᴄᴀᴧ дᴧя нᴇᴦо и ᴨᴩо нᴇᴦо <br>
                  ᴛᴀᴋ ᴄᴛᴩᴀнно быᴧо ощущᴀᴛь ᴄᴇбя ʍузой
                </p>
            </div>
        </div>

        <!-- Нижняя часть: Музыка -->
        <audio controls>
            <source src="music.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио.
        </audio>
        
    </div>
</body>
</html>
