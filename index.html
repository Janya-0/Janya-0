<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя музыка</title>
    <style>
        /* Общий фон страницы */
        body {
            background: linear-gradient(135deg, #1e1e2f, #3a3a5a);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Карточка плеера */
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin-top: 0;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Немного стилизуем сам тег audio */
        audio {
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            outline: none;
            /* Меняет цвет ползунка в некоторых браузерах */
            accent-color: #ff7eb3; 
        }
    </style>
</head>
<body>
    <div class="player-card">
        <h1>Слушаем музыку</h1>
        <audio controls>
            <source src="music.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио.
        </audio>
    </div>
</body>
</html>
